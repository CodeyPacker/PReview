# Packages the electron-vite build in out/. `pnpm package` makes an unpacked app in release/.
appId: com.codeypacker.preview
productName: PReview
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# The Claude Code binary can't run from inside the asar archive, so it ships next to it.
asarUnpack:
  - '**/node_modules/@anthropic-ai/claude-agent-sdk-*/**'
mac:
  target: dir
  files:
    - '!**/node_modules/@anthropic-ai/claude-agent-sdk-linux-*/**'
  # Unsigned until release signing is set up.
  identity: null
# Windows runs Claude Code's Linux build inside WSL, so only that binary ships.
win:
  target: dir
  files:
    - '!**/node_modules/@anthropic-ai/claude-agent-sdk-win32-*/**'
    - '!**/node_modules/@anthropic-ai/claude-agent-sdk-linux-arm64*/**'
    - '!**/node_modules/@anthropic-ai/claude-agent-sdk-linux-*-musl/**'
