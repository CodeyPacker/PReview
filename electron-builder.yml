# Packages the electron-vite build in out/. `pnpm package` makes the installers for this
# platform in release/, and `pnpm package:dir` an unpacked app to try quickly.
appId: com.codeypacker.preview
productName: PReview
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
# Where the app looks for updates. CI uploads the installers to the release for each version
# tag, so the builds themselves never publish.
publish:
  provider: github
  owner: CodeyPacker
  repo: PReview
# Agents run the user's own Claude Code, so the SDK's copies of it don't ship.
files:
  - out/**
  - package.json
  - '!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**'
# The zip is what updates download.
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # Ad-hoc signed until release signing is set up. Apple silicon won't open an app with no
  # signature at all. The hardened runtime is only needed to notarize.
  identity: '-'
  hardenedRuntime: false
win:
  target:
    - nsis
# Unsigned until release signing is set up, so Windows warns before it runs.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
